<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreeTV Sport — Chaînes sport gratuites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#060709;--surface:#0e1015;--surface2:#161a22;--border:#1e222b;--text:#f0f0f0;--text2:#8a8f9a;--accent:#FF3B30;--accent-hover:#e0342b;--radius:10px;--sidebar-w:300px}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* Header */
.header{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(6,7,9,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;z-index:100;gap:16px}
.header-logo{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--accent);white-space:nowrap}
.header-logo span{color:var(--text)}
.search-box{flex:1;max-width:400px;position:relative}
.search-box input{width:100%;padding:8px 14px 8px 36px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.search-box input:focus{border-color:var(--accent)}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text2)}
.header-stats{font-size:12px;color:var(--text2);white-space:nowrap}
.mobile-toggle{display:none;background:none;border:none;color:var(--text);cursor:pointer;padding:4px}
.mobile-toggle svg{width:24px;height:24px}

/* Layout */
.layout{display:flex;margin-top:56px;min-height:calc(100vh - 56px)}

/* Sidebar */
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:calc(100vh - 56px);position:sticky;top:56px;overflow:hidden}
.cat-list{padding:8px;display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.cat-btn{display:flex;align-items:center;gap:8px;padding:8px 12px;background:none;border:none;border-radius:6px;color:var(--text2);font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s;text-align:left;white-space:nowrap}
.cat-btn:hover{background:var(--surface2);color:var(--text)}
.cat-btn.active{background:var(--accent);color:#fff}
.cat-btn .cat-count{margin-left:auto;font-size:11px;opacity:.6}
.sidebar-divider{height:1px;background:var(--border);margin:4px 8px}
.channel-list{flex:1;overflow-y:auto;padding:4px 8px}
.channel-list::-webkit-scrollbar{width:4px}
.channel-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.ch-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;transition:all .15s;border:none;background:none;width:100%;text-align:left;color:var(--text);font-family:'Inter',sans-serif}
.ch-item:hover{background:var(--surface2)}
.ch-item.active{background:var(--accent);color:#fff}
.ch-item.active .ch-group{color:rgba(255,255,255,.7)}
.ch-item.active .ch-badge{background:rgba(255,255,255,.2);color:#fff}
.ch-logo{width:36px;height:36px;border-radius:6px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--accent);flex-shrink:0;overflow:hidden;letter-spacing:1px}
.ch-info{flex:1;min-width:0}
.ch-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-group{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-badges{display:flex;gap:4px;flex-shrink:0}
.ch-badge{font-size:9px;padding:2px 5px;border-radius:4px;font-weight:600;background:var(--surface2);color:var(--text2)}
.ch-badge.hd{background:rgba(255,59,48,.15);color:var(--accent)}
.ch-badge.geo{background:rgba(59,130,246,.15);color:#3b82f6}

/* Main */
.main{flex:1;padding:20px;display:flex;flex-direction:column;gap:20px;min-width:0}

/* Player */
.player-wrap{position:relative;width:100%;max-width:900px;aspect-ratio:16/9;background:#000;border-radius:var(--radius);overflow:hidden;margin:0 auto}
.player-wrap video{width:100%;height:100%;object-fit:contain;background:#000}
.player-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.85);gap:12px;text-align:center;padding:20px}
.player-overlay.hidden{display:none}
.player-overlay .icon{font-size:48px}
.player-overlay .msg{font-size:15px;color:var(--text2);max-width:360px;line-height:1.5}
.player-overlay a{color:var(--accent);text-decoration:none;font-weight:500}
.player-overlay a:hover{text-decoration:underline}
.now-playing{text-align:center;font-size:14px;color:var(--text2)}
.now-playing strong{color:var(--text);font-weight:600}

/* Grid */
.grid-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;color:var(--text2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;gap:8px}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 20px rgba(255,59,48,.1)}
.card-top{display:flex;align-items:center;gap:10px}
.card-logo{width:42px;height:42px;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--accent);flex-shrink:0;letter-spacing:1px}
.card-info{flex:1;min-width:0}
.card-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-group{font-size:11px;color:var(--text2)}
.card-badges{display:flex;gap:4px;margin-top:2px}
.card-badges .ch-badge{font-size:10px}

/* Responsive */
@media(max-width:768px){
  .sidebar{position:fixed;left:-100%;top:56px;bottom:0;z-index:99;transition:left .25s ease;width:280px;min-width:280px}
  .sidebar.open{left:0}
  .sidebar-backdrop{display:none;position:fixed;inset:0;top:56px;background:rgba(0,0,0,.5);z-index:98}
  .sidebar-backdrop.open{display:block}
  .mobile-toggle{display:block}
  .header-stats{display:none}
  .main{padding:14px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
  .card{padding:10px}
}
</style>
</head>

const CAT_MAP={
  'Football \u26bd':['football','soccer','calcio','fussball','depor','equipe','\u00e9quipe','serie a'],
  'Multi-sport \ud83c\udfc5':['sport','sports','eurosport','bein','espn','supersport','sportitalia','ert sport','cbc sport','trt spor','suspilne','xsport','m4 sport','alkass','stadium','san marino','belar'],

  'US Sports \ud83c\udfc0':['nba','nfl','nhl','mlb','wnba','basketball'],
  'Rugby / Cricket \ud83c\udfc9':['rugby','cricket'],
};

function getCategory(ch){
  const s=(ch.name+' '+ch.group).toLowerCase();
  for(const[cat,keys]of Object.entries(CAT_MAP)){
    if(keys.some(k=>s.includes(k)))return cat;
  }
  return 'Autres sports \ud83c\udfaf';
}

function getLogo(name){
  return name.replace(/[^A-Za-z0-9\u00C0-\u024F\u0400-\u04FF\u4e00-\u9fff]/g,'').slice(0,3).toUpperCase()||'TV';
}

// Build categories
const categories=new Map();
categories.set('Toutes \ud83d\udcfa',CHANNELS);
CHANNELS.forEach(ch=>{
  const cat=getCategory(ch);
  if(!categories.has(cat))categories.set(cat,[]);
  categories.get(cat).push(ch);
});

// Render categories
function renderCats(){
  const el=document.getElementById('catList');
  el.innerHTML='';
  categories.forEach((chs,cat)=>{
    const filtered=searchQuery?chs.filter(c=>matchSearch(c)):chs;
    const btn=document.createElement('button');
    btn.className='cat-btn'+(cat===currentCat?' active':'');
    btn.innerHTML=cat+'<span class="cat-count">'+filtered.length+'</span>';
    btn.onclick=()=>{currentCat=cat;renderCats();renderChannelList();renderGrid()};
    el.appendChild(btn);
  });
}

function matchSearch(ch){
  if(!searchQuery)return true;
  const q=searchQuery.toLowerCase();
  return ch.name.toLowerCase().includes(q)||ch.group.toLowerCase().includes(q);
}

function getVisible(){
  const list=currentCat==='Toutes \ud83d\udcfa'?CHANNELS:categories.get(currentCat)||[];
  return searchQuery?list.filter(matchSearch):list;
}

function badgesHTML(ch,cls){
  let h='';
  if(ch.hd)h+='<span class="'+(cls||'ch-badge')+' hd">HD</span>';
  else h+='<span class="'+(cls||'ch-badge')+'">SD</span>';
  if(ch.geo)h+='<span class="'+(cls||'ch-badge')+' geo">G\u00c9O</span>';
  return h;
}

function renderChannelList(){
  const el=document.getElementById('channelList');
  el.innerHTML='';
  getVisible().forEach(ch=>{
    const item=document.createElement('button');
    item.className='ch-item'+(currentChannel&&currentChannel.id===ch.id?' active':'');
    item.innerHTML=
      '<div class="ch-logo">'+getLogo(ch.name)+'</div>'+
      '<div class="ch-info"><div class="ch-name">'+ch.name+'</div><div class="ch-group">'+ch.group+'</div></div>'+
      '<div class="ch-badges">'+badgesHTML(ch)+'</div>';
    item.onclick=()=>play(ch.id);
    el.appendChild(item);
  });
}

function renderGrid(){
  const el=document.getElementById('grid');
  el.innerHTML='';
  getVisible().forEach(ch=>{
    const card=document.createElement('div');
    card.className='card';
    card.innerHTML=
      '<div class="card-top">'+
        '<div class="card-logo">'+getLogo(ch.name)+'</div>'+
        '<div class="card-info"><div class="card-name">'+ch.name+'</div><div class="card-group">'+ch.group+'</div></div>'+
      '</div>'+
      '<div class="card-badges">'+badgesHTML(ch,'ch-badge')+'</div>';
    card.onclick=()=>play(ch.id);
    el.appendChild(card);
  });
}

  overlay.classList.remove('hidden');
  const url=ch.url;
  const isYT=url.includes('dailymotion')||url.includes('youtube');
  const isMPD=url.includes('.mpd');

  let icon,msg;
  if(isYT){
    icon='\ud83d\udcfa';
    msg='<strong>'+ch.name+'</strong><br>Flux Dailymotion / YouTube<br><a href="'+url+'" target="_blank" rel="noopener">Ouvrir dans le navigateur</a>';
  }else if(isMPD){
    icon='\u26a0\ufe0f';
    msg='<strong>'+ch.name+'</strong><br>Format DASH (non support\u00e9 dans le navigateur)<br><a href="'+url+'" target="_blank" rel="noopener">Lien direct</a> \u00b7 Ouvrir avec VLC';
  }else{
    icon='\u26a0\ufe0f';
    msg='<strong>'+ch.name+'</strong><br>Flux indisponible ou serveur hors ligne<br><a href="'+url+'" target="_blank" rel="noopener">Lien direct</a> \u00b7 <a href="vlc://'+url+'">VLC</a>';
  }
  overlay.innerHTML='<div class="icon">'+icon+'</div><div class="msg">'+msg+'</div>';
}

function proxyUrl(url,proxyIdx){
  const encoded=encodeURIComponent(url);
  return CORS_PROXIES[proxyIdx]+encoded;
}

function startHls(ch,url,vid,overlay,attempt){
  if(hlsInstance){hlsInstance.destroy();hlsInstance=null}
  hlsInstance=new Hls({enableWorker:true,lowLatencyMode:true,
    xhrSetup:function(xhr,xhrUrl){
      // For proxied requests, we need to handle redirects
      xhr.withCredentials=false;
    }
  });
  hlsInstance.loadSource(url);
  hlsInstance.attachMedia(vid);
  hlsInstance.on(Hls.Events.MANIFEST_PARSED,()=>{
    overlay.classList.add('hidden');
    vid.play().catch(()=>{});
  });
  hlsInstance.on(Hls.Events.ERROR,(e,data)=>{
    if(!data.fatal)return;
    // Try next CORS proxy
    if(attempt<CORS_PROXIES.length){
      const proxied=proxyUrl(ch.url,attempt);
      startHls(ch,proxied,vid,overlay,attempt+1);
    }else{
      showErr(ch);
    }
  });
}

function play(id){
  const ch=CHANNELS.find(c=>c.id===id);
  if(!ch)return;

  currentChannel=ch;
  renderChannelList();
  renderGrid();

  // Close mobile sidebar
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('open');

  // Now playing
  document.getElementById('nowPlaying').innerHTML='En cours : <strong>'+ch.name+'</strong> \u2014 '+ch.group;

  // Destroy previous
  if(hlsInstance){hlsInstance.destroy();hlsInstance=null}

  const vid=document.getElementById('player');
  const overlay=document.getElementById('overlay');
  vid.removeAttribute('src');
  vid.load();

  const url=ch.url;
  const isYT=url.includes('dailymotion')||url.includes('youtube');
  const isMPD=url.includes('.mpd');

  if(isYT||isMPD){
    showErr(ch);
    return;
  }

  // Show loading state
  overlay.classList.remove('hidden');
  overlay.innerHTML='<div class="icon">\u23f3</div><div class="msg">Chargement de <strong>'+ch.name+'</strong>...</div>';

  // Fix http:// mixed content — proxy through CORS proxy which serves https
  const safeUrl=url.startsWith('http://')?proxyUrl(url,0):url;
  const startAttempt=url.startsWith('http://')?1:0;

  if(typeof Hls!=='undefined'&&Hls.isSupported()){
    startHls(ch,safeUrl,vid,overlay,startAttempt);
  }else if(vid.canPlayType('application/vnd.apple.mpegurl')){
    // Safari native — no CORS issue for HLS
    overlay.classList.add('hidden');
    vid.src=safeUrl;
    vid.load();
    vid.play().catch(()=>showErr(ch));
    vid.onerror=()=>showErr(ch);
  }else{
    showErr(ch);
  }
}

// Search
document.getElementById('search').addEventListener('input',e=>{
  searchQuery=e.target.value.trim();
  renderCats();
  renderChannelList();
  renderGrid();
});

// Mobile sidebar
document.getElementById('menuBtn').addEventListener('click',()=>{
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('backdrop').classList.toggle('open');
});
document.getElementById('backdrop').addEventListener('click',()=>{
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('open');
});

// Silence cross-origin resource errors (broken logos on iOS etc)
window.addEventListener('error',e=>{
  if(e.target&&e.target!==window){e.preventDefault();e.stopPropagation()}
},true);

// Init
renderCats();
renderChannelList();
renderGrid();
</script>
