<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FreeTV — Chaînes gratuites du monde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#060709;--surface:#0e1015;--surface2:#161a22;--border:#1e222b;--text:#f0f0f0;--text2:#8a8f9a;--accent:#FF3B30;--accent-hover:#e0342b;--radius:10px;--sidebar-w:300px}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;overflow-x:hidden}

/* Header */
.header{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(6,7,9,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;z-index:100;gap:16px;padding-top:env(safe-area-inset-top)}
.header-logo{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--accent);white-space:nowrap}
.header-logo span{color:var(--text)}
.search-box{flex:1;max-width:400px;position:relative}
.search-box input{width:100%;padding:8px 14px 8px 36px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:16px;outline:none;transition:border-color .2s;-webkit-appearance:none}
.search-box input:focus{border-color:var(--accent)}
.search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text2)}
.header-stats{font-size:12px;color:var(--text2);white-space:nowrap}
.mobile-toggle{display:none;background:none;border:none;color:var(--text);cursor:pointer;padding:4px}
.mobile-toggle svg{width:24px;height:24px}

/* Layout */
.layout{display:flex;margin-top:56px;min-height:calc(100vh - 56px)}

/* Sidebar */
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;height:calc(100vh - 56px);position:sticky;top:56px;overflow:hidden}
.cat-list{padding:8px;display:flex;flex-direction:column;gap:2px;flex-shrink:0;max-height:45vh;overflow-y:auto}
.cat-btn{display:flex;align-items:center;gap:8px;padding:8px 12px;background:none;border:none;border-radius:6px;color:var(--text2);font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s;text-align:left;white-space:nowrap}
.cat-btn:hover{background:var(--surface2);color:var(--text)}
.cat-btn.active{background:var(--accent);color:#fff}
.cat-btn .cat-count{margin-left:auto;font-size:11px;opacity:.6}
.sidebar-divider{height:1px;background:var(--border);margin:4px 8px}
.channel-list{flex:1;overflow-y:auto;padding:4px 8px;-webkit-overflow-scrolling:touch}
.channel-list::-webkit-scrollbar{width:4px}
.channel-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.ch-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;transition:all .15s;border:none;background:none;width:100%;text-align:left;color:var(--text);font-family:'Inter',sans-serif}
.ch-item:hover{background:var(--surface2)}
.ch-item.active{background:var(--accent);color:#fff}
.ch-item.active .ch-group{color:rgba(255,255,255,.7)}
.ch-logo{width:36px;height:36px;border-radius:6px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--accent);flex-shrink:0;overflow:hidden;letter-spacing:1px}
.ch-logo img{width:100%;height:100%;object-fit:contain}
.ch-info{flex:1;min-width:0}
.ch-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-group{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Main */
.main{flex:1;padding:20px;display:flex;flex-direction:column;gap:20px;min-width:0}

/* Player — sticky */
.player-section{position:sticky;top:56px;z-index:50;background:var(--bg);padding-bottom:8px}
.player-wrap{position:relative;width:100%;max-width:900px;aspect-ratio:16/9;background:#000;border-radius:var(--radius);overflow:hidden;margin:0 auto}
.player-wrap video{width:100%;height:100%;object-fit:contain;background:#000}
.player-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.85);gap:12px;text-align:center;padding:20px}
.player-overlay.hidden{display:none}
.player-overlay .icon{font-size:48px}
.player-overlay .msg{font-size:15px;color:var(--text2);max-width:360px;line-height:1.5}
.player-overlay a{color:var(--accent);text-decoration:none;font-weight:500}
.player-overlay a:hover{text-decoration:underline}
.now-playing{text-align:center;font-size:14px;color:var(--text2)}
.now-playing strong{color:var(--text);font-weight:600}

/* Channel nav bar (prev / next) */
.channel-nav{display:none;max-width:900px;margin:8px auto 0;align-items:center;gap:8px}
.channel-nav.visible{display:flex}
.nav-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0}
.nav-btn:hover{border-color:var(--accent);background:var(--surface)}
.nav-btn:active{transform:scale(.97)}
.nav-btn svg{width:16px;height:16px;flex-shrink:0}
.nav-btn .nav-name{max-width:120px;overflow:hidden;text-overflow:ellipsis}
.nav-current{flex:1;text-align:center;min-width:0}
.nav-current-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-current-group{font-size:11px;color:var(--text2)}

/* Dead channel indicators */
.ch-item.dead{opacity:.4}
.ch-item.dead .ch-name::after{content:' HS';font-size:10px;color:var(--accent);font-weight:700;margin-left:4px}
.card.dead{opacity:.4;order:9999}
.card.dead .card-name::after{content:' HS';font-size:10px;color:var(--accent);font-weight:700;margin-left:4px}
.err-actions{display:flex;gap:8px;margin-top:8px}
.err-btn{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.err-btn:hover{border-color:var(--accent)}
.err-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.err-btn.primary:hover{background:var(--accent-hover)}

/* Grid */
.grid-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;color:var(--text2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;gap:8px}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 20px rgba(255,59,48,.1)}
.card-top{display:flex;align-items:center;gap:10px}
.card-logo{width:42px;height:42px;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--accent);flex-shrink:0;letter-spacing:1px;overflow:hidden}
.card-logo img{width:100%;height:100%;object-fit:contain}
.card-info{flex:1;min-width:0}
.card-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-group{font-size:11px;color:var(--text2)}

/* Loading */
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px;color:var(--text2)}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Responsive */
@media(max-width:768px){
  .sidebar{position:fixed;left:-100%;top:56px;bottom:0;z-index:99;transition:left .25s ease;width:280px;min-width:280px}
  .sidebar.open{left:0}
  .sidebar-backdrop{display:none;position:fixed;inset:0;top:56px;background:rgba(0,0,0,.5);z-index:98}
  .sidebar-backdrop.open{display:block}
  .mobile-toggle{display:block}
  .header-stats{display:none}
  .main{padding:14px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .card{padding:10px}
  .player-wrap{border-radius:8px}
  .nav-btn .nav-name{max-width:60px}
  .nav-btn{padding:6px 10px;font-size:12px}
}
</style>
</head>
<body>

<header class="header">
  <button class="mobile-toggle" id="menuBtn" aria-label="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
  </button>
  <div class="header-logo"><span>FREE</span>TV</div>
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="search" placeholder="Rechercher une chaîne…" autocomplete="off">
  </div>
  <div class="header-stats" id="stats"></div>
</header>

<div class="sidebar-backdrop" id="backdrop"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="cat-list" id="catList"></div>
    <div class="sidebar-divider"></div>
    <div class="channel-list" id="channelList"></div>
  </aside>

  <main class="main" id="mainContent">
    <div class="loading-screen" id="loadingScreen">
      <div class="spinner"></div>
      <div>Chargement des chaînes…</div>
    </div>
  </main>
</div>

<script>
const PLAYLIST_URLS=[
  // ── France (441 chaînes TNT, régionales, sport, cinéma…) ──
  'https://raw.githubusercontent.com/schumijo/iptv/main/fr.m3u8',
  // ── Cinéma & Séries FR (Rakuten Films Action/Comédie/Drames/Thriller…) ──
  'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/fr_rakuten.m3u',
  // ── FAST France : Pluto TV, Samsung TV+, Plex (MAJ quotidienne) ──
  'https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/plutotv_fr.m3u',
  'https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/samsungtvplus_fr.m3u',
  'https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/plex_fr.m3u',
  // ── Catégories iptv-org ──
  'https://iptv-org.github.io/iptv/categories/sports.m3u',
  'https://iptv-org.github.io/iptv/categories/news.m3u',
  'https://iptv-org.github.io/iptv/categories/movies.m3u',
  'https://iptv-org.github.io/iptv/categories/music.m3u',
  'https://iptv-org.github.io/iptv/categories/documentary.m3u',
  'https://iptv-org.github.io/iptv/categories/entertainment.m3u',
  'https://iptv-org.github.io/iptv/categories/kids.m3u',
  // ── Pays ──
  'https://iptv-org.github.io/iptv/countries/fr.m3u',
  // ── Free-TV (chaînes vérifiées) ──
  'https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8',
];
const EPG_URLS=[
  'https://iptv-epg.org/files/epg-fr.xml',
];
const CORS_PROXIES=['https://corsproxy.io/?','https://api.allorigins.win/raw?url='];

let CHANNELS=[];
let categories=new Map();
let currentCat='Toutes';
let currentChannel=null;
let hlsInstance=null;
let searchQuery='';
const deadChannels=new Set();

// ── M3U8 Parser ──
function parseM3U(text,startId){
  const lines=text.split('\n');
  const channels=[];
  let id=startId||0;
  for(let i=0;i<lines.length;i++){
    const line=lines[i].trim();
    if(!line.startsWith('#EXTINF'))continue;
    // Find URL: skip #EXTVLCOPT and other # lines
    let urlLine='';
    for(let j=i+1;j<Math.min(i+4,lines.length);j++){
      const candidate=lines[j].trim();
      if(!candidate||candidate.startsWith('#'))continue;
      urlLine=candidate;break;
    }
    if(!urlLine)continue;
    // Skip non-streamable URLs
    if(!urlLine.startsWith('http'))continue;
    if(/\.(mpd|mp4|mkv|avi)(\?|$)/i.test(urlLine))continue;
    if(/youtube\.com|youtu\.be|dailymotion\.com/i.test(urlLine))continue;

    const name=line.split(',').slice(1).join(',').trim();
    if(!name)continue;

    const groupMatch=line.match(/group-title="([^"]*)"/);
    const logoMatch=line.match(/tvg-logo="([^"]*)"/);
    const countryMatch=line.match(/tvg-country="([^"]*)"/);
    const langMatch=line.match(/tvg-language="([^"]*)"/);

    channels.push({
      id:id++,
      name:name,
      group:cleanGroup(groupMatch?groupMatch[1]:''),
      logo:logoMatch?logoMatch[1]:'',
      country:countryMatch?countryMatch[1]:'',
      language:langMatch?langMatch[1]:'',
      url:urlLine
    });
  }
  return channels;
}

// ── Normalize category names ──
const CAT_MAP={
  // ── Cinéma & Séries ──
  'movies':'Cinéma','movie':'Cinéma','cinema':'Cinéma','cinéma':'Cinéma',
  'film':'Cinéma','films':'Cinéma','películas':'Cinéma','sinema':'Cinéma',
  'series':'Séries','séries':'Séries','drama':'Séries','drame':'Séries',
  'séries et divertissements':'Séries & Divertissement',
  'comedy':'Comédie','classic':'Classique','animation':'Animation',
  // ── Sport ──
  'sports':'Sport','sport':'Sport','deportes':'Sport',
  'sport multiplex':'Sport',
  // ── Info ──
  'news':'Info','information':'Info','actualités':'Info','noticias':'Info',
  // ── Divertissement ──
  'entertainment':'Divertissement','divertissement':'Divertissement',
  'entretenimiento':'Divertissement',
  // ── Musique ──
  'music':'Musique','musique':'Musique','música':'Musique',
  // ── Enfants ──
  'kids':'Enfants','children':'Enfants','infantil':'Enfants',
  'enfants':'Enfants','jeunesse':'Enfants',
  // ── Documentaire & Découverte ──
  'documentary':'Documentaire','documentaire':'Documentaire','documental':'Documentaire',
  'découverte':'Découverte','outdoor':'Nature',
  // ── Culture & Lifestyle ──
  'lifestyle':'Lifestyle','culture':'Culture','style de vie / pratique':'Lifestyle',
  'food':'Cuisine','cooking':'Cuisine','travel':'Voyage',
  // ── Éducation & Science ──
  'education':'Éducation','éducation':'Éducation','educación':'Éducation',
  'science':'Science',
  // ── France (TNT, régional, local) ──
  'tnt':'TNT France','régionale':'Régional','locale':'Local',
  // ── FAST Services ──
  'pluto tv':'Pluto TV','samsung tv plus':'Samsung TV+','plex':'Plex',
  // ── Autres ──
  'religious':'Religion','religion':'Religion','religión':'Religion',
  'weather':'Météo','business':'Business','auto':'Auto',
  'legislative':'Politique','étrangère':'International',
  'general':'Généraliste','undefined':'Autre','other':'Autre','misc':'Autre',
  'diversos':'Autre','xxx':'Adulte','shop':'Shopping'
};

// Ordre d'affichage des catégories (après "Toutes")
const CAT_ORDER=[
  'TNT France','Cinéma','Séries','Séries & Divertissement','Comédie',
  'Sport','Info','Divertissement','Musique','Enfants','Animation',
  'Documentaire','Découverte','Nature','Classique',
  'Régional','Local','International',
  'Pluto TV','Samsung TV+','Plex',
  'Lifestyle','Cuisine','Voyage',
  'Éducation','Science','Culture',
  'Religion','Radio','Météo','Business','Auto','Politique',
  'Généraliste','Autre'
];

function cleanGroup(raw){
  if(!raw)return 'Autre';
  const low=raw.toLowerCase().trim();
  if(CAT_MAP[low])return CAT_MAP[low];
  // Try partial match
  for(const[key,val] of Object.entries(CAT_MAP)){
    if(low.includes(key))return val;
  }
  // Capitalize first letter
  return raw.charAt(0).toUpperCase()+raw.slice(1);
}

// ── Build categories from group-title ──
function buildCategories(){
  categories=new Map();
  categories.set('Toutes',CHANNELS);

  const groups=new Map();
  CHANNELS.forEach(ch=>{
    const g=ch.group||'Autre';
    if(!groups.has(g))groups.set(g,[]);
    groups.get(g).push(ch);
  });

  // Sort groups by predefined order, then alphabetically for unlisted ones
  const sorted=[...groups.entries()].sort((a,b)=>{
    const ia=CAT_ORDER.indexOf(a[0]),ib=CAT_ORDER.indexOf(b[0]);
    const oa=ia>=0?ia:CAT_ORDER.length,ob=ib>=0?ib:CAT_ORDER.length;
    if(oa!==ob)return oa-ob;
    return a[0].localeCompare(b[0],'fr');
  });
  sorted.forEach(([g,chs])=>categories.set(g,chs));
}

// ── Logo helper ──
function logoHTML(ch,cls){
  if(ch.logo){
    return '<div class="'+cls+'"><img src="'+ch.logo+'" alt="" loading="lazy" onerror="this.parentElement.textContent=\''+getInitials(ch.name)+'\'"></div>';
  }
  return '<div class="'+cls+'">'+getInitials(ch.name)+'</div>';
}

function getInitials(name){
  return name.replace(/[^A-Za-z0-9\u00C0-\u024F\u0400-\u04FF\u4e00-\u9fff]/g,'').slice(0,3).toUpperCase()||'TV';
}

// ── Render ──
function renderCats(){
  const el=document.getElementById('catList');
  el.innerHTML='';
  categories.forEach((chs,cat)=>{
    const filtered=searchQuery?chs.filter(matchSearch):chs;
    if(filtered.length===0&&cat!=='Toutes')return;
    const btn=document.createElement('button');
    btn.className='cat-btn'+(cat===currentCat?' active':'');
    btn.innerHTML=cat+'<span class="cat-count">'+filtered.length+'</span>';
    btn.onclick=()=>{currentCat=cat;renderCats();renderChannelList();renderGrid()};
    el.appendChild(btn);
  });
}

function matchSearch(ch){
  if(!searchQuery)return true;
  const q=searchQuery.toLowerCase();
  return ch.name.toLowerCase().includes(q)||ch.group.toLowerCase().includes(q)||ch.country.toLowerCase().includes(q);
}

function getVisible(){
  const list=currentCat==='Toutes'?CHANNELS:categories.get(currentCat)||[];
  return searchQuery?list.filter(matchSearch):list;
}

function renderChannelList(){
  const el=document.getElementById('channelList');
  el.innerHTML='';
  const visible=getVisible();
  // Limit sidebar to 200 for performance
  const limit=Math.min(visible.length,200);
  for(let i=0;i<limit;i++){
    const ch=visible[i];
    const item=document.createElement('button');
    item.className='ch-item'+(currentChannel&&currentChannel.id===ch.id?' active':'')+(deadChannels.has(ch.id)?' dead':'');
    item.innerHTML=
      logoHTML(ch,'ch-logo')+
      '<div class="ch-info"><div class="ch-name">'+ch.name+'</div><div class="ch-group">'+ch.group+'</div></div>';
    item.onclick=()=>play(ch.id);
    el.appendChild(item);
  }
  if(visible.length>limit){
    const more=document.createElement('div');
    more.style.cssText='text-align:center;padding:12px;color:var(--text2);font-size:12px';
    more.textContent='+ '+(visible.length-limit)+' chaînes (utilisez la recherche)';
    el.appendChild(more);
  }
}

function renderGrid(){
  const el=document.getElementById('grid');
  if(!el)return;
  el.innerHTML='';
  const visible=getVisible();
  const limit=Math.min(visible.length,150);
  for(let i=0;i<limit;i++){
    const ch=visible[i];
    const card=document.createElement('div');
    card.className='card'+(deadChannels.has(ch.id)?' dead':'');
    card.innerHTML=
      '<div class="card-top">'+
        logoHTML(ch,'card-logo')+
        '<div class="card-info"><div class="card-name">'+ch.name+'</div><div class="card-group">'+ch.group+'</div></div>'+
      '</div>';
    card.onclick=()=>play(ch.id);
    el.appendChild(card);
  }
  if(visible.length>limit){
    const more=document.createElement('div');
    more.style.cssText='text-align:center;padding:16px;color:var(--text2);font-size:13px;grid-column:1/-1';
    more.textContent='+ '+(visible.length-limit)+' chaînes supplémentaires';
    el.appendChild(more);
  }
}

// ── Player ──
function showErr(ch){
  // Mark as dead
  deadChannels.add(ch.id);
  renderChannelList();
  renderGrid();

  const overlay=document.getElementById('overlay');
  overlay.classList.remove('hidden');
  const url=ch.url;
  const isYT=url.includes('dailymotion')||url.includes('youtube');
  const isMPD=url.includes('.mpd');
  let icon,reason;
  if(isYT){
    icon='📺';reason='Flux Dailymotion / YouTube';
  }else if(isMPD){
    icon='⚠️';reason='Format DASH non supporté';
  }else{
    icon='⚠️';reason='Flux indisponible ou hors ligne';
  }
  const{next}=getNeighbors();
  overlay.innerHTML=
    '<div class="icon">'+icon+'</div>'+
    '<div class="msg"><strong>'+ch.name+'</strong><br>'+reason+'</div>'+
    '<div class="err-actions">'+
      (next?'<button class="err-btn primary" onclick="play('+next.id+')">Chaîne suivante &rarr;</button>':'')+
      '<a class="err-btn" href="'+url+'" target="_blank" rel="noopener">Lien direct</a>'+
    '</div>';
}

function proxyUrl(url,idx){
  return CORS_PROXIES[idx]+encodeURIComponent(url);
}

function startHls(ch,url,vid,overlay,attempt){
  if(hlsInstance){hlsInstance.destroy();hlsInstance=null}
  hlsInstance=new Hls({
    enableWorker:true,
    lowLatencyMode:true,
    maxBufferLength:30,
    maxMaxBufferLength:60,
    xhrSetup:function(xhr){xhr.withCredentials=false}
  });
  hlsInstance.loadSource(url);
  hlsInstance.attachMedia(vid);
  hlsInstance.on(Hls.Events.MANIFEST_PARSED,()=>{
    overlay.classList.add('hidden');
    vid.play().catch(()=>{});
  });
  hlsInstance.on(Hls.Events.ERROR,(e,data)=>{
    if(!data.fatal)return;
    if(attempt<CORS_PROXIES.length){
      startHls(ch,proxyUrl(ch.url,attempt),vid,overlay,attempt+1);
    }else{
      showErr(ch);
    }
  });
}

function play(id){
  const ch=CHANNELS.find(c=>c.id===id);
  if(!ch)return;

  currentChannel=ch;
  renderChannelList();
  renderGrid();
  updateNav();

  // Close mobile sidebar
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('open');

  document.getElementById('nowPlaying').innerHTML='En cours : <strong>'+ch.name+'</strong> — '+ch.group;

  // Scroll player into view
  const ps=document.getElementById('playerSection');
  if(ps)ps.scrollIntoView({behavior:'smooth',block:'start'});

  if(hlsInstance){hlsInstance.destroy();hlsInstance=null}

  const vid=document.getElementById('player');
  const overlay=document.getElementById('overlay');
  vid.removeAttribute('src');
  vid.load();

  const url=ch.url;
  const isYT=url.includes('dailymotion')||url.includes('youtube');
  const isMPD=url.includes('.mpd');

  if(isYT||isMPD){
    showErr(ch);
    return;
  }

  overlay.classList.remove('hidden');
  overlay.innerHTML='<div class="icon">⏳</div><div class="msg">Chargement de <strong>'+ch.name+'</strong>…</div>';

  // Fix http:// mixed content
  const safeUrl=url.startsWith('http://')?proxyUrl(url,0):url;
  const startAttempt=url.startsWith('http://')?1:0;

  // iPhone Safari: native HLS — no hls.js needed, better compatibility
  const isSafari=/^((?!chrome|android).)*safari/i.test(navigator.userAgent)||
    (navigator.userAgent.includes('AppleWebKit')&&!navigator.userAgent.includes('Chrome'));

  if(isSafari&&vid.canPlayType('application/vnd.apple.mpegurl')){
    overlay.classList.add('hidden');
    vid.src=safeUrl;
    vid.load();
    vid.play().catch(()=>{});
    vid.onerror=()=>{
      // Try with proxy on error
      if(startAttempt<CORS_PROXIES.length&&vid.src===safeUrl){
        vid.src=proxyUrl(ch.url,startAttempt);
        vid.load();
        vid.play().catch(()=>{});
        vid.onerror=()=>showErr(ch);
      }else{
        showErr(ch);
      }
    };
  }else if(typeof Hls!=='undefined'&&Hls.isSupported()){
    startHls(ch,safeUrl,vid,overlay,startAttempt);
  }else{
    showErr(ch);
  }
}

function showPlayer(){
  const main=document.getElementById('mainContent');
  main.innerHTML=`
    <div class="player-section" id="playerSection">
      <div class="player-wrap">
        <video id="player" controls playsinline webkit-playsinline autoplay></video>
        <div class="player-overlay" id="overlay">
          <div class="icon">📡</div>
          <div class="msg">Sélectionnez une chaîne pour démarrer</div>
        </div>
      </div>
      <div class="now-playing" id="nowPlaying"></div>
      <div class="channel-nav" id="channelNav">
        <button class="nav-btn" id="prevBtn" title="Chaîne précédente">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
          <span class="nav-name" id="prevName"></span>
        </button>
        <div class="nav-current">
          <div class="nav-current-name" id="navCurrentName"></div>
          <div class="nav-current-group" id="navCurrentGroup"></div>
        </div>
        <button class="nav-btn" id="nextBtn" title="Chaîne suivante">
          <span class="nav-name" id="nextName"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
    </div>
    <div class="grid-title" id="gridTitle">Toutes les chaînes</div>
    <div class="grid" id="grid"></div>
  `;
}

function getNeighbors(){
  const visible=getVisible();
  if(!currentChannel||visible.length===0)return{prev:null,next:null};
  const idx=visible.findIndex(c=>c.id===currentChannel.id);
  if(idx===-1)return{prev:visible[visible.length-1],next:visible[0]};
  return{
    prev:idx>0?visible[idx-1]:visible[visible.length-1],
    next:idx<visible.length-1?visible[idx+1]:visible[0]
  };
}

function updateNav(){
  const nav=document.getElementById('channelNav');
  if(!nav)return;
  if(!currentChannel){nav.classList.remove('visible');return}
  nav.classList.add('visible');
  const{prev,next}=getNeighbors();
  document.getElementById('navCurrentName').textContent=currentChannel.name;
  document.getElementById('navCurrentGroup').textContent=currentChannel.group;
  document.getElementById('prevName').textContent=prev?prev.name:'';
  document.getElementById('nextName').textContent=next?next.name:'';
  document.getElementById('prevBtn').onclick=prev?()=>play(prev.id):null;
  document.getElementById('nextBtn').onclick=next?()=>play(next.id):null;
}

async function fetchPlaylist(url){
  try{
    const res=await fetch(url);
    if(res.ok)return await res.text();
  }catch(e){}
  // Fallback via CORS proxy
  try{
    const res=await fetch(CORS_PROXIES[0]+encodeURIComponent(url));
    if(res.ok)return await res.text();
  }catch(e){}
  return '';
}

function updateUI(){
  buildCategories();
  document.getElementById('stats').textContent=CHANNELS.length+' chaînes • '+(categories.size-1)+' catégories';
  showPlayer();
  renderCats();
  renderChannelList();
  renderGrid();
}

async function init(){
  const seen=new Set();
  let loaded=0;

  // Load all playlists (France first, then world)
  for(const url of PLAYLIST_URLS){
    const text=await fetchPlaylist(url);
    if(!text)continue;
    const parsed=parseM3U(text,CHANNELS.length);
    // Deduplicate by URL
    for(const ch of parsed){
      if(seen.has(ch.url))continue;
      seen.add(ch.url);
      CHANNELS.push(ch);
    }
    loaded++;
    // Show UI as soon as first playlist loads
    if(loaded===1&&CHANNELS.length>0){
      updateUI();
    }
  }

  if(CHANNELS.length===0){
    document.getElementById('mainContent').innerHTML=
      '<div class="loading-screen"><div class="icon" style="font-size:48px">❌</div><div>Impossible de charger les playlists</div></div>';
    return;
  }

  // Re-assign IDs after dedup
  CHANNELS.forEach((ch,i)=>ch.id=i);
  updateUI();
}

// Search
document.getElementById('search').addEventListener('input',e=>{
  searchQuery=e.target.value.trim();
  renderCats();
  renderChannelList();
  renderGrid();
  const titleEl=document.getElementById('gridTitle');
  if(titleEl)titleEl.textContent=searchQuery?'Résultats pour "'+searchQuery+'"':'Toutes les chaînes';
});

// Mobile sidebar
document.getElementById('menuBtn').addEventListener('click',()=>{
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('backdrop').classList.toggle('open');
});
document.getElementById('backdrop').addEventListener('click',()=>{
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('open');
});

// Silence broken image errors
window.addEventListener('error',e=>{
  if(e.target&&e.target!==window){e.preventDefault();e.stopPropagation()}
},true);

// Go
init();
</script>
