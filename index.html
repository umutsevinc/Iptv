<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FreeTV — Chaînes gratuites du monde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#141414;
  --surface:#1a1a2e;
  --surface2:#222240;
  --border:rgba(255,255,255,.08);
  --text:#e5e5e5;
  --text2:#808080;
  --accent:#e50914;
  --accent-hover:#f40612;
  --radius:6px;
  --header-h:68px;
  --mini-w:400px;
  --mini-h:225px;
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;overflow-x:hidden}

/* ═══ HEADER ═══ */
.header{
  position:fixed;top:0;left:0;right:0;height:var(--header-h);
  background:linear-gradient(180deg,rgba(20,20,20,.95) 0%,rgba(20,20,20,.8) 100%);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  display:flex;align-items:center;padding:0 4%;z-index:200;gap:20px;
  padding-top:env(safe-area-inset-top);
}
.header-logo{
  font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:3px;
  color:var(--accent);white-space:nowrap;text-shadow:0 0 20px rgba(229,9,20,.5);
}
.header-logo span{color:var(--text)}
.search-box{flex:1;max-width:400px;position:relative}
.search-box input{
  width:100%;padding:10px 16px 10px 40px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);
  border-radius:24px;color:#fff;font-size:14px;outline:none;
  transition:all .3s;-webkit-appearance:none;
}
.search-box input:focus{background:rgba(255,255,255,.18);border-color:var(--accent);box-shadow:0 0 20px rgba(229,9,20,.15)}
.search-box input::placeholder{color:var(--text2)}
.search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text2)}
.header-stats{font-size:12px;color:var(--text2);white-space:nowrap}
.mobile-toggle{display:none;background:none;border:none;color:var(--text);cursor:pointer;padding:4px}
.mobile-toggle svg{width:24px;height:24px}

/* ═══ CATEGORY NAV BAR ═══ */
.cat-nav{
  position:fixed;top:var(--header-h);left:0;right:0;z-index:190;
  background:linear-gradient(180deg,rgba(20,20,20,.9) 0%,rgba(20,20,20,0) 100%);
  padding:12px 4% 20px;display:flex;gap:8px;overflow-x:auto;
  -ms-overflow-style:none;scrollbar-width:none;
}
.cat-nav::-webkit-scrollbar{display:none}
.cat-pill{
  padding:7px 18px;background:transparent;
  border:1px solid rgba(255,255,255,.25);border-radius:20px;
  color:var(--text2);font-size:13px;font-family:'Inter',sans-serif;
  cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0;
}
.cat-pill:hover{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.4)}
.cat-pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ═══ MAIN CONTENT ═══ */
.main{padding-top:calc(var(--header-h) + 60px);padding-bottom:40px}

/* ═══ NETFLIX ROWS ═══ */
.row-section{margin-bottom:32px;position:relative}
.row-title{
  font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1.5px;
  color:#fff;padding:0 4% 10px;
  transition:color .2s;
}
.row-title:hover{color:var(--text2)}
.row-scroll{
  display:flex;gap:10px;overflow-x:auto;padding:0 4% 8px;
  scroll-snap-type:x mandatory;-ms-overflow-style:none;scrollbar-width:none;
  scroll-padding-left:4%;
}
.row-scroll::-webkit-scrollbar{display:none}

/* ═══ NETFLIX CARD ═══ */
.card{
  flex-shrink:0;width:220px;background:var(--surface);
  border-radius:var(--radius);overflow:hidden;cursor:pointer;
  transition:all .3s cubic-bezier(.4,0,.2,1);position:relative;
  scroll-snap-align:start;
}
.card:hover{
  transform:scale(1.08);z-index:10;
  box-shadow:0 8px 40px rgba(0,0,0,.8),0 0 20px rgba(229,9,20,.15);
}
.card-thumb{
  width:100%;height:130px;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.card-thumb img{width:100%;height:100%;object-fit:cover}
.card-thumb .initials{
  font-family:'Bebas Neue',sans-serif;font-size:32px;
  color:var(--accent);letter-spacing:2px;opacity:.6;
}
.card-thumb::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:40%;
  background:linear-gradient(transparent,var(--surface));
}
.card-play{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);
  width:44px;height:44px;background:rgba(229,9,20,.9);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:transform .25s cubic-bezier(.4,0,.2,1);
  box-shadow:0 4px 15px rgba(0,0,0,.5);
}
.card:hover .card-play{transform:translate(-50%,-50%) scale(1)}
.card-play svg{width:20px;height:20px;color:#fff;margin-left:2px}
.card-body{padding:10px 12px 12px}
.card-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.card-group{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ═══ STATUS DOT ═══ */
.status-dot{
  position:absolute;top:8px;left:8px;width:10px;height:10px;
  border-radius:50%;z-index:5;border:1.5px solid rgba(0,0,0,.4);
  transition:background .3s;
}
.status-dot.unknown{background:#555}
.status-dot.online{background:#2ecc40;box-shadow:0 0 6px rgba(46,204,64,.6)}
.status-dot.offline{background:#e50914;box-shadow:0 0 6px rgba(229,9,20,.6)}

/* Active card */
.card.playing{border:2px solid var(--accent)}
.card.playing .status-dot{animation:pulse-dot 1.5s infinite}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}

/* Dead */
.card.dead{opacity:.35;filter:grayscale(.7)}

/* ═══ FLOATING MINI PLAYER ═══ */
.mini-player{
  position:fixed;bottom:24px;right:24px;z-index:300;
  width:var(--mini-w);border-radius:12px;overflow:hidden;
  background:#000;box-shadow:0 10px 50px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.1);
  transform:translateY(120%) scale(.9);opacity:0;
  transition:all .4s cubic-bezier(.4,0,.2,1);
}
.mini-player.visible{transform:translateY(0) scale(1);opacity:1}
.mini-player-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;background:linear-gradient(180deg,rgba(0,0,0,.9),rgba(0,0,0,.6));
  position:absolute;top:0;left:0;right:0;z-index:5;
  opacity:0;transition:opacity .2s;
}
.mini-player:hover .mini-player-header{opacity:1}
.mini-player-info{flex:1;min-width:0}
.mini-player-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-player-group{font-size:11px;color:var(--text2)}
.mini-player-actions{display:flex;gap:4px}
.mini-btn{
  width:32px;height:32px;border-radius:50%;border:none;
  background:rgba(255,255,255,.15);color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.mini-btn:hover{background:rgba(255,255,255,.3)}
.mini-btn svg{width:16px;height:16px}
.mini-player-video{width:100%;aspect-ratio:16/9;background:#000;display:block}
.mini-player-controls{
  display:flex;align-items:center;gap:6px;padding:8px 12px;
  background:linear-gradient(0deg,rgba(0,0,0,.9),rgba(0,0,0,.6));
  position:absolute;bottom:0;left:0;right:0;z-index:5;
  opacity:0;transition:opacity .2s;
}
.mini-player:hover .mini-player-controls{opacity:1}
.mini-nav-btn{
  padding:6px 12px;border-radius:6px;border:none;
  background:rgba(255,255,255,.12);color:#fff;cursor:pointer;
  font-size:12px;font-family:'Inter',sans-serif;transition:all .2s;
  display:flex;align-items:center;gap:4px;
}
.mini-nav-btn:hover{background:var(--accent)}
.mini-nav-btn svg{width:14px;height:14px}
.mini-nav-spacer{flex:1}


/* ═══ SEARCH RESULTS GRID ═══ */
.search-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:0 4%}
.search-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1.5px;color:#fff;padding:0 4% 16px}

/* ═══ HERO BANNER ═══ */
.hero{
  position:relative;height:55vh;max-height:500px;margin-bottom:20px;
  background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
  display:flex;align-items:flex-end;padding:0 4% 40px;
}
.hero::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:40%;
  background:linear-gradient(transparent,var(--bg));
}
.hero-content{position:relative;z-index:2;max-width:600px}
.hero-tag{
  display:inline-block;padding:4px 12px;background:var(--accent);
  border-radius:4px;font-size:12px;font-weight:600;letter-spacing:1px;
  text-transform:uppercase;margin-bottom:12px;
}
.hero-title{
  font-family:'Bebas Neue',sans-serif;font-size:clamp(36px,6vw,64px);
  letter-spacing:3px;line-height:1;margin-bottom:8px;
  text-shadow:0 2px 20px rgba(0,0,0,.5);
}
.hero-sub{font-size:15px;color:var(--text2);line-height:1.5;max-width:450px}

/* ═══ LOADING ═══ */
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px;color:var(--text2)}
.spinner{width:44px;height:44px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Player overlay messages */
.player-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.85);gap:12px;text-align:center;padding:20px;z-index:6}
.player-overlay.hidden{display:none}
.player-overlay .icon{font-size:48px}
.player-overlay .msg{font-size:15px;color:var(--text2);max-width:360px;line-height:1.5}
.player-overlay a{color:var(--accent);text-decoration:none;font-weight:500}
.player-overlay a:hover{text-decoration:underline}
.err-actions{display:flex;gap:8px;margin-top:8px}
.err-btn{padding:8px 16px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:var(--text);font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.err-btn:hover{border-color:var(--accent)}
.err-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.err-btn.primary:hover{background:var(--accent-hover)}

/* ═══ SCROLL LOADER ═══ */
.scroll-loader{display:flex;justify-content:center;padding:24px;grid-column:1/-1}
.scroll-loader .spinner{width:32px;height:32px}

/* ═══ RESPONSIVE ═══ */
@media(max-width:768px){
  .header{padding:0 12px;gap:10px}
  .header-logo{font-size:28px}
  .header-stats{display:none}
  .mobile-toggle{display:block}
  .cat-nav{padding:10px 12px 16px;gap:6px}
  .cat-pill{padding:6px 14px;font-size:12px}
  .main{padding-top:calc(var(--header-h) + 52px)}
  .row-title{font-size:18px;padding:0 12px 8px}
  .row-scroll{gap:8px;padding:0 12px 8px}
  .card{width:160px}
  .card-thumb{height:95px}
  .card-thumb .initials{font-size:24px}
  .card-body{padding:8px 10px 10px}
  .card-name{font-size:12px}
  .hero{height:40vh;padding:0 12px 30px}
  .hero-title{font-size:clamp(28px,5vw,48px)}
  .mini-player{--mini-w:280px;bottom:12px;right:12px}
  .search-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:0 12px}
  .search-title{padding:0 12px 12px;font-size:22px}
}

/* Row arrow buttons */
.row-arrow{
  position:absolute;top:50%;transform:translateY(-50%);z-index:10;
  width:40px;height:80px;border:none;cursor:pointer;
  background:rgba(20,20,20,.8);color:#fff;display:flex;
  align-items:center;justify-content:center;opacity:0;
  transition:opacity .2s;
}
.row-section:hover .row-arrow{opacity:1}
.row-arrow:hover{background:rgba(229,9,20,.8)}
.row-arrow svg{width:24px;height:24px}
.row-arrow.left{left:0;border-radius:0 4px 4px 0}
.row-arrow.right{right:0;border-radius:4px 0 0 4px}
</style>
</head>
<body>

<header class="header">
  <button class="mobile-toggle" id="menuBtn" aria-label="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
  </button>
  <div class="header-logo"><span>FREE</span>TV</div>
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="search" placeholder="Rechercher une chaîne…" autocomplete="off">
  </div>

<nav class="cat-nav" id="catNav"></nav>

<!-- ═══ MINI FLOATING PLAYER ═══ -->
<div class="mini-player" id="miniPlayer">
  <div class="mini-player-header">

      <div class="mini-player-name" id="miniName"></div>

      <button class="mini-btn" id="expandBtn" title="Agrandir">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
      </button>
      <button class="mini-btn" id="closePlayerBtn" title="Fermer">

<script>
const PLAYLIST_URLS=[
  // ── Sport en priorité ──
  'https://iptv-org.github.io/iptv/categories/sports.m3u',
  'https://raw.githubusercontent.com/hayatiptv/iptv/master/SPORTV.m3u',
  // ── France ──
  'https://raw.githubusercontent.com/schumijo/iptv/main/fr.m3u8',
  'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/fr_rakuten.m3u',
  'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/fr.m3u',
  'https://raw.githubusercontent.com/iptv-org/iptv/master/streams/fr_samsung.m3u',
  // ── FAST France ──
  'https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/plutotv_fr.m3u',
  'https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/samsungtvplus_fr.m3u',
  'https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/plex_fr.m3u',
  // ── Turquie ──
  'https://raw.githubusercontent.com/hayatiptv/iptv/master/index.m3u',
  // ── Catégories iptv-org ──
  'https://iptv-org.github.io/iptv/categories/news.m3u',
  'https://iptv-org.github.io/iptv/categories/movies.m3u',
  'https://iptv-org.github.io/iptv/categories/music.m3u',
  'https://iptv-org.github.io/iptv/categories/documentary.m3u',
  'https://iptv-org.github.io/iptv/categories/entertainment.m3u',
  'https://iptv-org.github.io/iptv/categories/kids.m3u',
  // ── Pays ──
  'https://iptv-org.github.io/iptv/countries/fr.m3u',
  'https://iptv-org.github.io/iptv/countries/tr.m3u',
  // ── Free-TV ──
  'https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8',
  // ── Master iptv-org (toutes les chaînes manquantes) ──
  'https://iptv-org.github.io/iptv/index.m3u',
];
const CORS_PROXIES=['https://corsproxy.io/?','https://api.allorigins.win/raw?url='];

let CHANNELS=[];
const CHANNEL_MAP=new Map();
let categories=new Map();
let currentCat='Toutes';
let currentChannel=null;
let hlsInstance=null;
let searchQuery='';
const deadChannels=new Set();
let activeCardId=null;

// ── Pagination state ──
const PAGE_SIZE=40;
let gridPage=0;
let gridLoading=false;
let gridObserver=null;

// ── Channel health status: 'unknown' | 'online' | 'offline' ──
const channelStatus=new Map();
let healthCheckQueue=[];
let healthChecking=false;
const CONCURRENT_CHECKS=4;

// ── Dead logo domains ──
const DEAD_LOGO_HOSTS=new Set([
  'm.yilmaztv.cc','euro-medya.ath.cx','foto.fotodepo.fr',
  'mdstream.net','obsfullhd.tv','s3.i3ns.net','xplatinmedia.com'
]);
function isLogoValid(url){
  if(!url)return false;
  if(url.startsWith('http://'))return false;
  try{return !DEAD_LOGO_HOSTS.has(new URL(url).hostname)}catch(e){return false}
}
function markLogoDead(url){
  try{DEAD_LOGO_HOSTS.add(new URL(url).hostname)}catch(e){}
}

const PLAY_SVG='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';

// ── Health checker ──
function getStatusClass(id){
  return channelStatus.get(id)||'unknown';
}

function checkChannelHealth(ch){
  return new Promise(resolve=>{
    if(channelStatus.has(ch.id)){resolve();return}
    const url=ch.url;
    // Obvious dead formats
    if(/youtube\.com|youtu\.be|dailymotion\.com/i.test(url)||/\.mpd(\?|$)/i.test(url)){
      channelStatus.set(ch.id,'offline');
      updateDotInDOM(ch.id,'offline');
      resolve();return;
    }
    const safeUrl=url.startsWith('http://')?CORS_PROXIES[0]+encodeURIComponent(url):url;
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),6000);
    fetch(safeUrl,{method:'HEAD',mode:'no-cors',signal:controller.signal})
      .then(()=>{
        clearTimeout(timer);
        channelStatus.set(ch.id,'online');
        updateDotInDOM(ch.id,'online');
      })
      .catch(()=>{
        clearTimeout(timer);
        channelStatus.set(ch.id,'offline');
        updateDotInDOM(ch.id,'offline');
      })
      .finally(resolve);
  });
}

function updateDotInDOM(chId,status){
  document.querySelectorAll('.card').forEach(c=>{
    if(c._chId===chId){
      const dot=c.querySelector('.status-dot');
      if(dot){dot.className='status-dot '+status}
    }
  });
}

async function runHealthChecks(){
  if(healthChecking)return;
  healthChecking=true;
  while(healthCheckQueue.length>0){
    const batch=healthCheckQueue.splice(0,CONCURRENT_CHECKS);
    await Promise.all(batch.map(ch=>checkChannelHealth(ch)));
  }
  healthChecking=false;
}

function queueHealthCheck(channels){
  const toCheck=channels.filter(ch=>!channelStatus.has(ch.id));
  healthCheckQueue.push(...toCheck);
  runHealthChecks();
}

// ── M3U8 Parser ──
function parseM3U(text,startId){
  const lines=text.split('\n');
  const channels=[];
  let id=startId||0;
  for(let i=0;i<lines.length;i++){
    const line=lines[i].trim();
    if(!line.startsWith('#EXTINF'))continue;
    let urlLine='';
    for(let j=i+1;j<Math.min(i+4,lines.length);j++){
      const candidate=lines[j].trim();
      if(!candidate||candidate.startsWith('#'))continue;
      urlLine=candidate;break;
    }
    if(!urlLine)continue;
    if(!urlLine.startsWith('http'))continue;
    if(/\.(mpd|mp4|mkv|avi)(\?|$)/i.test(urlLine))continue;
    if(/youtube\.com|youtu\.be|dailymotion\.com/i.test(urlLine))continue;
    const name=line.split(',').slice(1).join(',').trim();
    if(!name)continue;
    const groupMatch=line.match(/group-title="([^"]*)"/);
    const logoMatch=line.match(/tvg-logo="([^"]*)"/);
    const countryMatch=line.match(/tvg-country="([^"]*)"/);
    const langMatch=line.match(/tvg-language="([^"]*)"/);
    channels.push({id:id++,name,group:cleanGroup(groupMatch?groupMatch[1]:''),logo:logoMatch?logoMatch[1]:'',country:countryMatch?countryMatch[1]:'',language:langMatch?langMatch[1]:'',url:urlLine});
  }
  return channels;
}

// ── Normalize category names ──
const CAT_MAP={
  'movies':'Cinéma','movie':'Cinéma','cinema':'Cinéma','cinéma':'Cinéma',
  'film':'Cinéma','films':'Cinéma','películas':'Cinéma','sinema':'Cinéma',
  'series':'Séries','séries':'Séries','drama':'Séries','drame':'Séries',
  'séries et divertissements':'Séries & Divertissement',
  'comedy':'Comédie','classic':'Classique','animation':'Animation',
  'sports':'Sport','sport':'Sport','deportes':'Sport','spor':'Sport','sport multiplex':'Sport',
  'news':'Info','information':'Info','actualités':'Info','noticias':'Info','haber':'Info','haberler':'Info',
  'entertainment':'Divertissement','divertissement':'Divertissement','entretenimiento':'Divertissement','eğlence':'Divertissement',
  'music':'Musique','musique':'Musique','música':'Musique','müzik':'Musique',
  'kids':'Enfants','children':'Enfants','infantil':'Enfants','çocuk':'Enfants','enfants':'Enfants','jeunesse':'Enfants','animasyon':'Animation',
  'documentary':'Documentaire','documentaire':'Documentaire','documental':'Documentaire','belgesel':'Documentaire','belge':'Documentaire',
  'découverte':'Découverte','outdoor':'Nature','doğa':'Nature',
  'lifestyle':'Lifestyle','culture':'Culture','style de vie / pratique':'Lifestyle',
  'food':'Cuisine','cooking':'Cuisine','travel':'Voyage',
  'education':'Éducation','éducation':'Éducation','educación':'Éducation','eğitim':'Éducation','science':'Science',
  'tnt':'TNT France','régionale':'Régional','locale':'Local',
  'pluto tv':'Pluto TV','samsung tv plus':'Samsung TV+','plex':'Plex',
  'ulusal':'Turquie','turk hd+ line':'Turquie','türk':'Turquie',
  'eski̇ usul':'Turquie','eski usul':'Turquie','eskİ usul':'Turquie',
  'bölgesel':'Régional','yerel':'Régional',
  'religious':'Religion','religion':'Religion','religión':'Religion','dini':'Religion',
  'radyo':'Radio','radyo türk':'Radio',
  'weather':'Météo','business':'Business','auto':'Auto',
  'legislative':'Politique','étrangère':'International',
  'general':'Généraliste','undefined':'Autre','other':'Autre','misc':'Autre','diversos':'Autre','xxx':'Adulte','shop':'Shopping'
};
const CAT_ORDER=['Sport','TNT France','Cinéma','Séries','Séries & Divertissement','Comédie','Info','Divertissement','Musique','Enfants','Animation','Documentaire','Découverte','Nature','Classique','Régional','Local','International','Pluto TV','Samsung TV+','Plex','Turquie','Lifestyle','Cuisine','Voyage','Éducation','Science','Culture','Religion','Radio','Météo','Business','Auto','Politique','Généraliste','Autre'];

function cleanGroup(raw){
  if(!raw)return 'Autre';
  const low=raw.toLowerCase().trim().replace(/İ/g,'i').replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c');
  const lowOrig=raw.toLowerCase().trim();
  if(CAT_MAP[lowOrig])return CAT_MAP[lowOrig];
  if(CAT_MAP[low])return CAT_MAP[low];
  for(const[key,val] of Object.entries(CAT_MAP)){
    if(low.includes(key)||lowOrig.includes(key))return val;
  }
  return raw.charAt(0).toUpperCase()+raw.slice(1);
}

function buildCategories(){
  categories=new Map();
  categories.set('Toutes',CHANNELS);
  const groups=new Map();
  CHANNELS.forEach(ch=>{
    const g=ch.group||'Autre';
    if(!groups.has(g))groups.set(g,[]);
    groups.get(g).push(ch);
  });
  const sorted=[...groups.entries()].sort((a,b)=>{
    const ia=CAT_ORDER.indexOf(a[0]),ib=CAT_ORDER.indexOf(b[0]);
    const oa=ia>=0?ia:CAT_ORDER.length,ob=ib>=0?ib:CAT_ORDER.length;
    if(oa!==ob)return oa-ob;
    return a[0].localeCompare(b[0],'fr');
  });
  sorted.forEach(([g,chs])=>categories.set(g,chs));
}

function getInitials(name){
  return name.replace(/[^A-Za-z0-9\u00C0-\u024F\u0400-\u04FF]/g,'').slice(0,3).toUpperCase()||'TV';
}

function matchSearch(ch){
  if(!searchQuery)return true;
  const q=searchQuery.toLowerCase();
  return ch.name.toLowerCase().includes(q)||ch.group.toLowerCase().includes(q)||ch.country.toLowerCase().includes(q);
}

function getVisible(){
  const list=currentCat==='Toutes'?CHANNELS:categories.get(currentCat)||[];
  return searchQuery?list.filter(matchSearch):list;
}

// ── Card HTML ──
function createCard(ch){
  const card=document.createElement('div');
  card.className='card'+(deadChannels.has(ch.id)?' dead':'')+(currentChannel&&currentChannel.id===ch.id?' playing':'');
  const hasLogo=isLogoValid(ch.logo);
  const status=getStatusClass(ch.id);
  const thumbContent=
    '<div class="status-dot '+status+'"></div>'+
    (hasLogo
      ?'<img src="'+ch.logo+'" alt="" loading="lazy" onerror="markLogoDead(this.src);this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
        +'<span class="initials" style="display:none;position:absolute;inset:0;align-items:center;justify-content:center">'+getInitials(ch.name)+'</span>'
      :'<span class="initials">'+getInitials(ch.name)+'</span>');
  card.innerHTML=
    '<div class="card-thumb">'+thumbContent+'<div class="card-play">'+PLAY_SVG+'</div></div>'+
    '<div class="card-body"><div class="card-name">'+ch.name+'</div><div class="card-group">'+ch.group+'</div></div>';
  card._chId=ch.id;
  card.onclick=()=>play(ch.id);
  return card;
}

// ── Render category pills ──
function renderCats(){
  const nav=document.getElementById('catNav');
  nav.innerHTML='';
  categories.forEach((chs,cat)=>{
    const filtered=searchQuery?chs.filter(matchSearch):chs;
    if(filtered.length===0&&cat!=='Toutes')return;
    const pill=document.createElement('button');
    pill.className='cat-pill'+(cat===currentCat?' active':'');
    pill.textContent=cat+' ('+filtered.length+')';
    pill.onclick=()=>{
      currentCat=cat;
      renderCats();
      renderContent();
      window.scrollTo({top:0,behavior:'smooth'});
    };
    nav.appendChild(pill);
  });
}

// ── Infinite scroll sentinel ──
function createSentinel(container){
  if(gridObserver)gridObserver.disconnect();
  const sentinel=document.createElement('div');
  sentinel.className='scroll-loader';
  sentinel.id='scrollSentinel';
  sentinel.innerHTML='<div class="spinner"></div>';
  container.appendChild(sentinel);

  gridObserver=new IntersectionObserver(entries=>{
    if(entries[0].isIntersecting&&!gridLoading){
      loadMoreCards();
    }
  },{rootMargin:'400px'});
  gridObserver.observe(sentinel);
}

function loadMoreCards(){
  const grid=document.getElementById('paginatedGrid');
  const sentinel=document.getElementById('scrollSentinel');
  if(!grid||!sentinel)return;
  const visible=getVisible();
  const start=gridPage*PAGE_SIZE;
  if(start>=visible.length){
    sentinel.remove();
    if(gridObserver)gridObserver.disconnect();
    return;
  }
  gridLoading=true;
  const end=Math.min(start+PAGE_SIZE,visible.length);
  const batch=visible.slice(start,end);
  for(const ch of batch){
    grid.insertBefore(createCard(ch),sentinel);
  }
  gridPage++;
  gridLoading=false;
  // Queue health checks for this batch
  queueHealthCheck(batch);
  // Remove sentinel if no more
  if(end>=visible.length){
    sentinel.remove();
    if(gridObserver)gridObserver.disconnect();
  }
}

// ── Render Netflix rows or search grid ──
function renderContent(){
  const main=document.getElementById('mainContent');
  main.innerHTML='';
  gridPage=0;
  if(gridObserver)gridObserver.disconnect();

  if(searchQuery){
    const visible=getVisible();
    const title=document.createElement('div');
    title.className='search-title';
    title.textContent='Résultats pour "'+searchQuery+'" ('+visible.length+')';
    main.appendChild(title);
    const grid=document.createElement('div');
    grid.className='search-grid';
    grid.id='paginatedGrid';
    main.appendChild(grid);
    createSentinel(grid);
    loadMoreCards();
    return;
  }

  if(currentCat!=='Toutes'){
    const chs=categories.get(currentCat)||[];
    const title=document.createElement('div');
    title.className='search-title';
    title.textContent=currentCat+' ('+chs.length+')';
    main.appendChild(title);
    const grid=document.createElement('div');
    grid.className='search-grid';
    grid.id='paginatedGrid';
    main.appendChild(grid);
    createSentinel(grid);
    loadMoreCards();
    return;
  }

  // "Toutes" → Netflix-style rows per category (lazy loaded)
  let first=true;
  const catEntries=[...categories.entries()].filter(([cat])=>cat!=='Toutes');
  const rowObserver=new IntersectionObserver((entries,obs)=>{
    entries.forEach(entry=>{
      if(!entry.isIntersecting)return;
      const section=entry.target;
      const catName=section.dataset.cat;
      const chs=categories.get(catName)||[];
      if(section.dataset.loaded)return;
      section.dataset.loaded='1';
      const scroll=section.querySelector('.row-scroll');
      const limit=Math.min(chs.length,40);
      const batch=chs.slice(0,limit);
      for(const ch of batch) scroll.appendChild(createCard(ch));
      queueHealthCheck(batch);
      obs.unobserve(section);
    });
  },{rootMargin:'600px'});

  for(const[cat,chs] of catEntries){
    if(chs.length===0)continue;

    if(first){
      first=false;
      const hero=document.createElement('div');
      hero.className='hero';
      hero.innerHTML=
        '<div class="hero-content">'+
          '<div class="hero-tag">EN DIRECT</div>'+
          '<div class="hero-title">FreeTV</div>'+
          '<div class="hero-sub">Des milliers de chaînes gratuites du monde entier. Sport, cinéma, info, divertissement et bien plus.</div>'+
        '</div>';
      main.appendChild(hero);
    }

    const section=document.createElement('div');
    section.className='row-section';
    section.dataset.cat=cat;

    const title=document.createElement('div');
    title.className='row-title';
    title.textContent=cat;
    section.appendChild(title);

    const scroll=document.createElement('div');
    scroll.className='row-scroll';
    section.appendChild(scroll);

    // Arrow buttons
    const leftArr=document.createElement('button');
    leftArr.className='row-arrow left';
    leftArr.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>';
    leftArr.onclick=()=>scroll.scrollBy({left:-600,behavior:'smooth'});
    section.appendChild(leftArr);

    const rightArr=document.createElement('button');
    rightArr.className='row-arrow right';
    rightArr.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>';
    rightArr.onclick=()=>scroll.scrollBy({left:600,behavior:'smooth'});
    section.appendChild(rightArr);

    main.appendChild(section);
    rowObserver.observe(section);
  }
}

// ── Player logic ──
function proxyUrl(url,idx){return CORS_PROXIES[idx]+encodeURIComponent(url)}

const IS_SAFARI=/^((?!chrome|android).)*safari/i.test(navigator.userAgent)||
  (navigator.userAgent.includes('AppleWebKit')&&!navigator.userAgent.includes('Chrome'));

function startHls(ch,url,vid,attempt){
  if(hlsInstance){hlsInstance.destroy();hlsInstance=null}
  hlsInstance=new Hls({
    enableWorker:true,
    lowLatencyMode:true,
    maxBufferLength:10,
    maxMaxBufferLength:30,
    maxBufferSize:30*1000*1000,
    startFragPrefetch:true,
    testBandwidth:false,
    enableWebVTT:true,
    enableCEA708Captions:true,
    renderTextTracksNatively:true,
    xhrSetup:function(xhr){xhr.withCredentials=false}
  });
  hlsInstance.loadSource(url);
  hlsInstance.attachMedia(vid);
  hlsInstance.on(Hls.Events.MANIFEST_PARSED,()=>{
    document.getElementById('overlay').classList.add('hidden');
    vid.play().catch(()=>{});
    // Mark as online
    channelStatus.set(ch.id,'online');
    updateDotInDOM(ch.id,'online');
  });
  hlsInstance.on(Hls.Events.ERROR,(e,data)=>{
    if(!data.fatal)return;
    if(attempt<CORS_PROXIES.length){
      startHls(ch,proxyUrl(ch.url,attempt),vid,attempt+1);
    }else{
      channelStatus.set(ch.id,'offline');
      updateDotInDOM(ch.id,'offline');
      showErr(ch);
    }
  });
}

function showErr(ch){
  deadChannels.add(ch.id);
  channelStatus.set(ch.id,'offline');
  updateDotInDOM(ch.id,'offline');
  const overlay=document.getElementById('overlay');
  overlay.classList.remove('hidden');
  const url=ch.url;
  const isYT=url.includes('dailymotion')||url.includes('youtube');
  const isMPD=url.includes('.mpd');
  let icon='⚠️',reason='Flux indisponible ou hors ligne';
  if(isYT){icon='📺';reason='Flux Dailymotion / YouTube'}
  else if(isMPD){reason='Format DASH non supporté'}
  const{next}=getNeighbors();
  overlay.innerHTML=
    '<div class="icon">'+icon+'</div>'+
    '<div class="msg"><strong>'+ch.name+'</strong><br>'+reason+'</div>'+
    '<div class="err-actions">'+
      (next?'<button class="err-btn primary" onclick="play('+next.id+')">Suivante &rarr;</button>':'')+
      '<a class="err-btn" href="'+url+'" target="_blank" rel="noopener">Lien direct</a>'+
    '</div>';
}

function getNeighbors(){
  const visible=getVisible();
  if(!currentChannel||visible.length===0)return{prev:null,next:null};
  const idx=visible.findIndex(c=>c.id===currentChannel.id);
  if(idx===-1)return{prev:visible[visible.length-1],next:visible[0]};
  return{
    prev:idx>0?visible[idx-1]:visible[visible.length-1],
    next:idx<visible.length-1?visible[idx+1]:visible[0]
  };
}

function updateActiveCard(newId){
  if(activeCardId!==null){
    const old=document.querySelector('.card.playing');
    if(old)old.classList.remove('playing');
  }
  activeCardId=newId;
  const cards=document.querySelectorAll('.card');
  for(const c of cards){
    if(c._chId===newId){c.classList.add('playing');break}
  }
}

function play(id){
  const ch=CHANNEL_MAP.get(id);
  if(!ch)return;

  if(hlsInstance){hlsInstance.destroy();hlsInstance=null}
  currentChannel=ch;

  // Show mini player
  const mini=document.getElementById('miniPlayer');
  mini.classList.add('visible');
  document.getElementById('miniName').textContent=ch.name;
  document.getElementById('miniGroup').textContent=ch.group;

  const{prev,next}=getNeighbors();
  document.getElementById('miniPrevBtn').onclick=prev?()=>play(prev.id):null;
  document.getElementById('miniNextBtn').onclick=next?()=>play(next.id):null;

  updateActiveCard(id);

  const vid=document.getElementById('player');
  const overlay=document.getElementById('overlay');

  const url=ch.url;
  if(/youtube\.com|youtu\.be|dailymotion\.com/i.test(url)||/\.mpd(\?|$)/i.test(url)){
    showErr(ch);return;
  }

  overlay.classList.remove('hidden');
  overlay.innerHTML='<div class="icon">⏳</div><div class="msg">Chargement…</div>';

  const safeUrl=url.startsWith('http://')?proxyUrl(url,0):url;
  const startAttempt=url.startsWith('http://')?1:0;

  if(IS_SAFARI&&vid.canPlayType('application/vnd.apple.mpegurl')){
    overlay.classList.add('hidden');
    vid.src=safeUrl;
    vid.play().catch(()=>{});
    vid.onerror=()=>{
      if(startAttempt<CORS_PROXIES.length&&vid.src===safeUrl){
        vid.src=proxyUrl(ch.url,startAttempt);
        vid.play().catch(()=>{});
        vid.onerror=()=>showErr(ch);
      }else{showErr(ch)}
    };
  }else if(typeof Hls!=='undefined'&&Hls.isSupported()){
    startHls(ch,safeUrl,vid,startAttempt);
  }else{
    showErr(ch);
  }
}

// ── Fullscreen (native browser) ──
function openFullPlayer(){
  const vid=document.getElementById('player');
  vid.setAttribute('controls','');
  // Enable subtitle/caption tracks if available
  for(let i=0;i<vid.textTracks.length;i++){
    vid.textTracks[i].mode='showing';
  }
  // Also enable HLS subtitle tracks
  if(hlsInstance){
    hlsInstance.subtitleDisplay=true;
    if(hlsInstance.subtitleTracks.length>0&&hlsInstance.subtitleTrack===-1){
      hlsInstance.subtitleTrack=0;
    }
  }
  if(vid.requestFullscreen)vid.requestFullscreen();
  else if(vid.webkitRequestFullscreen)vid.webkitRequestFullscreen();
  else if(vid.webkitEnterFullscreen)vid.webkitEnterFullscreen(); // iOS
}

// Remove controls when exiting fullscreen
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement){
    document.getElementById('player').removeAttribute('controls');
  }
});
document.addEventListener('webkitfullscreenchange',()=>{
  if(!document.webkitFullscreenElement){
    document.getElementById('player').removeAttribute('controls');
  }
});

// ── Event listeners ──
document.getElementById('expandBtn').addEventListener('click',openFullPlayer);
document.getElementById('closePlayerBtn').addEventListener('click',()=>{
  if(hlsInstance){hlsInstance.destroy();hlsInstance=null}
  const vid=document.getElementById('player');
  vid.removeAttribute('src');vid.load();
  document.getElementById('miniPlayer').classList.remove('visible');
  currentChannel=null;
  activeCardId=null;
  document.querySelectorAll('.card.playing').forEach(c=>c.classList.remove('playing'));
});

// Search with debounce
let searchTimer=null;
document.getElementById('search').addEventListener('input',e=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{
    searchQuery=e.target.value.trim();
    currentCat='Toutes';
    renderCats();
    renderContent();
  },200);
});

// Mobile menu
document.getElementById('menuBtn').addEventListener('click',()=>{
  document.getElementById('catNav').scrollTo({left:0,behavior:'smooth'});
});

// Silence broken image errors
window.addEventListener('error',e=>{
  if(e.target&&e.target!==window){e.preventDefault();e.stopPropagation()}
},true);

// ── Fetch & Init ──
async function fetchPlaylist(url){
  try{const res=await fetch(url);if(res.ok)return await res.text()}catch(e){}
  try{const res=await fetch(CORS_PROXIES[0]+encodeURIComponent(url));if(res.ok)return await res.text()}catch(e){}
  return '';
}

function updateUI(){
  buildCategories();
  document.getElementById('stats').textContent=CHANNELS.length+' chaînes • '+(categories.size-1)+' catégories';
  renderCats();
  renderContent();
}

async function init(){
  const seen=new Set();
  let loaded=0;
  for(const url of PLAYLIST_URLS){
    const text=await fetchPlaylist(url);
    if(!text)continue;
    const parsed=parseM3U(text,CHANNELS.length);
    for(const ch of parsed){
      if(seen.has(ch.url))continue;
      seen.add(ch.url);
      CHANNEL_MAP.set(ch.id,ch);
      CHANNELS.push(ch);
    }
    loaded++;
    if(loaded===1&&CHANNELS.length>0)updateUI();
  }
  if(CHANNELS.length===0){
    document.getElementById('mainContent').innerHTML=
      '<div class="loading-screen"><div style="font-size:48px">❌</div><div>Impossible de charger les playlists</div></div>';
    return;
  }
  CHANNELS.forEach((ch,i)=>{ch.id=i;CHANNEL_MAP.set(i,ch)});
  updateUI();
}

init();
</script>
